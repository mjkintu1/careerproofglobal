<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" role="img" aria-labelledby="cpg-title-dk cpg-desc-dk">
  <title id="cpg-title-dk">CareerProof Global</title>
  <desc id="cpg-desc-dk">Map your path. Prove your future.</desc>
  <defs>
    <linearGradient id="cpg-tile-dk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1257D1"/><stop offset="1" stop-color="#0A3D8F"/></linearGradient>
    <linearGradient id="cpg-proof-dk" gradientUnits="userSpaceOnUse" x1="372" y1="0" x2="537" y2="0">
      <stop offset="0" stop-color="#00B4D8"/>
      <stop offset="0.25" stop-color="#00C8BA"/>
      <stop offset="0.5" stop-color="#5DD389"/>
      <stop offset="0.75" stop-color="#B4D24A"/>
      <stop offset="1" stop-color="#FDC500"/>
    </linearGradient>
  </defs>
  <rect width="560" height="180" fill="#0B1F33"/>
  <!-- Mark -->
  <g transform="translate(20 30)">
    <rect width="120" height="120" rx="28" fill="url(#cpg-tile-dk)"/>
    <polyline points="30,62 52,84 90,40" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="62" r="9" fill="#00B4D8" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="52" cy="84" r="9" fill="#00B4D8" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="90" cy="40" r="12" fill="#FDC500" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <!-- Wordmark -->
  <g font-family="'Plus Jakarta Sans', 'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif">
    <text x="164" y="96" font-size="60" font-weight="800" fill="#FFFFFF" textLength="200" lengthAdjust="spacingAndGlyphs">Career</text>
    <text x="372" y="96" font-size="60" font-weight="800" fill="url(#cpg-proof-dk)" textLength="165" lengthAdjust="spacingAndGlyphs">Proof</text>
    <text x="167" y="126" font-size="20" font-weight="700" fill="#FFFFFF" textLength="132" lengthAdjust="spacing">GLOBAL</text>
    <rect x="310" y="118" width="227" height="2" rx="1" fill="#FFFFFF" opacity="0.35"/>
    <text x="167" y="158" font-size="17" font-weight="500" fill="#CBD5E1" textLength="300" lengthAdjust="spacing">Map your path. Prove your future.</text>
  </g>
</svg>
