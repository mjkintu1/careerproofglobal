<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="cpg-title-32">
  <title id="cpg-title-32">CareerProof Global</title>
  <!-- The official mark (careerproof-global-icon.svg) redrawn on a 32 px grid: same path, three nodes and white rings,
       with node centres and edges on whole pixels so it stays sharp in browser tabs. -->
  <defs><linearGradient id="cpg-tile-32" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1257D1"/><stop offset="1" stop-color="#0A3D8F"/></linearGradient></defs>
  <rect width="32" height="32" rx="7.5" fill="url(#cpg-tile-32)"/>
  <polyline points="8,16 14,22 24,10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="8" cy="16" r="2.5" fill="#00B4D8" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="14" cy="22" r="2.5" fill="#00B4D8" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="24" cy="10" r="3.5" fill="#FDC500" stroke="#FFFFFF" stroke-width="1"/>
</svg>
