<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="cpg-title-i">
  <title id="cpg-title-i">CareerProof Global</title>
  <defs><linearGradient id="cpg-tile-i" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1257D1"/><stop offset="1" stop-color="#0A3D8F"/></linearGradient></defs>
  <rect width="120" height="120" rx="28" fill="url(#cpg-tile-i)"/>
  <!-- A check mark drawn as a career path: start, step, destination -->
  <polyline points="30,62 52,84 90,40" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="30" cy="62" r="9" fill="#00B4D8" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="52" cy="84" r="9" fill="#00B4D8" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="90" cy="40" r="12" fill="#FDC500" stroke="#FFFFFF" stroke-width="3"/>
</svg>
